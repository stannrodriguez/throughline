<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#FBFAF7"/>
  <line x1="0" y1="74" x2="1200" y2="74" stroke="#E2E0DA" stroke-width="2"/>
  <text x="68" y="49" fill="#20242A" font-family="Arial, sans-serif" font-size="25" font-weight="700">Throughline</text>
  <text x="108" y="174" fill="#9AA0A8" font-family="monospace" font-size="18" letter-spacing="4">THREE ROADS · TWELVE PERIODS · NINETY INVENTIONS</text>
  <text x="108" y="270" fill="#20242A" font-family="Arial, sans-serif" font-size="62" font-weight="700">A history of technology</text>
  <text x="108" y="343" fill="#20242A" font-family="Arial, sans-serif" font-size="62" font-weight="700">told through its constraints.</text>
  <text x="110" y="415" fill="#6D7178" font-family="Georgia, serif" font-size="27">What held each era back—and the invention that removed it.</text>
  <g transform="translate(108 488)">
    <line x1="0" y1="0" x2="298" y2="0" stroke="#B4551F" stroke-width="8"/>
    <line x1="342" y1="0" x2="640" y2="0" stroke="#5A7D5E" stroke-width="8"/>
    <line x1="684" y1="0" x2="982" y2="0" stroke="#38648C" stroke-width="8"/>
    <text x="0" y="44" fill="#8A6D52" font-family="monospace" font-size="18" letter-spacing="2">ENERGY</text>
    <text x="342" y="44" fill="#5A7D5E" font-family="monospace" font-size="18" letter-spacing="2">MATERIALS</text>
    <text x="684" y="44" fill="#38648C" font-family="monospace" font-size="18" letter-spacing="2">INFORMATION</text>
  </g>
</svg>
